name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag to release (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: caerus-framework/common-actions/.github/workflows/go-module-release.yml@main
    with:
      module: caerus-framework
      deps: ""
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    secrets:
      token: ${{ secrets.GH_TOKEN }}
