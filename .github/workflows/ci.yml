name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: caerus-framework/caerus-framework/.github/workflows/go-module-ci.yml@main
    with:
      module: caerus-framework
      deps: ""
      coverage-min: "50"
      caerusvet: true
